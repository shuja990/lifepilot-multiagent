# Render blueprint — https://render.com/docs/blueprint-spec
#
# Two services: the UI as a static site, the API as a Docker web service.
#
# On the free plan the API sleeps after 15 minutes of inactivity and takes about
# a minute to wake. The static site never sleeps, so the page loads immediately
# and shows a waking notice while the API comes back.

services:
  # ------------------------------------------------------------------ web app
  # A static site, not a web service. Static sites are free, CDN-served and
  # never sleep, so the page always loads instantly even when the API behind it
  # is still waking. Putting the UI on a free web service instead would mean a
  # blank screen for the first minute after an idle period.
  - type: web
    name: lifepilot-web
    runtime: static
    buildCommand: npm ci && npm run build --workspace @lifepilot/shared && npm run build --workspace @lifepilot/web
    staticPublishPath: ./apps/web/out
    pullRequestPreviewsEnabled: false
    buildFilter:
      paths:
        - apps/web/**
        - packages/shared/**
    routes:
      # Next exports /reset as reset.html; without this the route 404s on a
      # hard refresh or when the emailed reset link is opened directly.
      - type: rewrite
        source: /reset
        destination: /reset.html
    envVars:
      # Baked into the bundle at build time, so changing it needs a redeploy.
      - key: NEXT_PUBLIC_API_URL
        sync: false

  # ---------------------------------------------------------------------- api
  - type: web
    name: lifepilot-api
    runtime: docker
    plan: free
    region: frankfurt # closest to most demo traffic; oregon and singapore also exist
    dockerfilePath: ./apps/api/Dockerfile
    # The build context must be the repo root: the lockfile and the shared
    # workspace both live above the Dockerfile.
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit

    envVars:
      # --- set these in the Render dashboard, never in this file ---
      - key: GOOGLE_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: TICK_SECRET
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false

      # --- safe to keep in version control ---
      - key: NODE_ENV
        value: production
      - key: GOOGLE_GENAI_USE_VERTEXAI
        value: 'FALSE'
      # Pinned, never a -latest alias: those drift onto newer models whose free
      # tier is a fraction of the size.
      - key: GEMINI_MODEL_DEFAULT
        value: gemini-3.6-flash
      - key: GEMINI_MODEL_FAST
        value: gemini-3.5-flash-lite
      - key: PREMIUM_ENABLED
        value: 'false'

      # These three must match the deployed URLs, so they are set in the
      # dashboard once the service and the Vercel project have real hostnames:
      #   PUBLIC_BASE_URL           https://lifepilot-api.onrender.com
      #   WEB_BASE_URL              https://<your-app>.vercel.app
      #   GOOGLE_OAUTH_REDIRECT_URI https://lifepilot-api.onrender.com/connect/google/callback
      - key: PUBLIC_BASE_URL
        sync: false
      - key: WEB_BASE_URL
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
